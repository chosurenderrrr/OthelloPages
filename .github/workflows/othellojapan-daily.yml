name: Update today's tsume Othello (OthelloJapan)

# Othello! JAPAN publishes a new problem at 08:00 JST (23:00 UTC).
on:
  schedule:
    - cron: '10 23 * * *'
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: othellojapan-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch today's problems
        run: node .github/scripts/fetch_othellojapan.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/tsume/othellojapan_today.txt; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tsume/othellojapan_today.txt
          git commit -m "Update today's tsume Othello (OthelloJapan)"
          git push
